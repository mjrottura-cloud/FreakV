<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE FREAK PROTOCOL — 92 Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1215; --panel:#171c21; --panel2:#1d242b; --line:#2a3138;
  --text:#e8e4dc; --dim:#9aa3ac; --faint:#6b7580;
  --ember:#e0862b; --ember-dk:#a35d15;
  --teal:#3fa7bd; --green:#4caf7d; --red:#d64545; --gold:#c9a84c;
  --mono:'IBM Plex Mono',monospace; --disp:'Barlow Condensed',sans-serif; --body:'Barlow',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;padding-bottom:90px}
::selection{background:var(--ember);color:#0f1215}

header{padding:26px 18px 14px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--ember) var(--prog,0%),var(--line) var(--prog,0%))}
.brand{font-family:var(--disp);font-weight:900;font-size:34px;letter-spacing:.03em;line-height:1}
.brand em{font-style:normal;color:var(--ember)}
.tagline{color:var(--dim);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}

nav{display:flex;gap:2px;position:sticky;top:0;background:var(--bg);z-index:50;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:86px;background:none;border:none;color:var(--dim);font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.08em;padding:13px 8px 11px;cursor:pointer;border-bottom:3px solid transparent;text-transform:uppercase}
nav button.active{color:var(--text);border-bottom-color:var(--ember)}
nav button:focus-visible{outline:2px solid var(--ember);outline-offset:-2px}

main{max-width:820px;margin:0 auto;padding:18px}
section.tab{display:none}
section.tab.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.tab.active{animation:none}}

.daycount{font-family:var(--disp);font-weight:900;font-size:76px;line-height:.9;letter-spacing:.01em}
.daycount span{font-size:30px;color:var(--faint);font-weight:800}
.phasechip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:4px 10px;border:1px solid var(--ember);color:var(--ember);border-radius:3px;text-transform:uppercase;margin-top:8px}
.datebar{display:flex;align-items:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.datebar .dt{font-family:var(--mono);font-size:13px;color:var(--dim)}
.datebar button{background:var(--panel);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 12px;border-radius:4px;cursor:pointer}
.datebar button:hover{border-color:var(--ember)}
.datebar button:focus-visible{outline:2px solid var(--ember)}

.quote{border-left:3px solid var(--gold);padding:12px 16px;margin:18px 0;background:var(--panel);border-radius:0 6px 6px 0}
.quote p{font-size:16.5px;font-weight:500;font-style:italic;color:var(--text)}
.quote cite{display:block;margin-top:6px;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:14px 0;overflow:hidden}
.card>.chead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card>.chead h3{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.card>.chead .sub{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.card .cbody{padding:8px 16px 14px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:2px 8px;border-radius:3px;text-transform:uppercase}
.tag.swim{background:rgba(63,167,189,.15);color:var(--teal)}
.tag.lift{background:rgba(224,134,43,.15);color:var(--ember)}
.tag.rehab{background:rgba(76,175,125,.15);color:var(--green)}
.tag.lax{background:rgba(201,168,76,.16);color:var(--gold)}
.tag.rec{background:rgba(154,163,172,.15);color:var(--dim)}
.tag.test{background:rgba(214,69,69,.15);color:var(--red)}

.exrow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:start}
.exrow:last-child{border-bottom:none}
.exrow .nm{font-weight:600;font-size:14.5px}
.exrow .nm small{display:block;font-weight:400;color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.45}
.exrow .dose{font-family:var(--mono);font-size:13px;color:var(--ember);white-space:nowrap;text-align:right;padding-top:2px}
.exrow.done .nm,.exrow.done .dose{opacity:.38;text-decoration:line-through}
.exrow label{display:flex;gap:10px;cursor:pointer;align-items:start}
.exrow input{margin-top:4px;accent-color:var(--ember);width:15px;height:15px;flex:none}
.blockh{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin:14px 0 2px}
.blockh:first-child{margin-top:6px}
.why{background:var(--panel2);border-radius:6px;padding:10px 14px;margin-top:12px;font-size:13.5px;color:var(--dim)}
.why b{color:var(--text)}

.ph{border:1px solid var(--line);border-radius:8px;margin:14px 0;overflow:hidden}
.ph summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline;background:var(--panel)}
.ph summary::-webkit-details-marker{display:none}
.ph summary .n{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--ember)}
.ph summary h3{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.ph summary .rng{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-left:auto}
.ph .pbody{padding:4px 16px 16px;border-top:1px solid var(--line)}
.wk{margin:10px 0;border-left:2px solid var(--line);padding-left:12px}
.wk h4{font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.wk p{font-size:13.5px;color:var(--dim)}

table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
th{font-family:var(--disp);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;text-align:left;color:var(--dim);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.mono{font-family:var(--mono);font-size:12.5px;color:var(--ember);white-space:nowrap}
tr:last-child td{border-bottom:none}

.alert{border:1px solid var(--red);background:rgba(214,69,69,.08);border-radius:8px;padding:12px 16px;margin:14px 0}
.alert h4{color:var(--red);font-family:var(--disp);font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.pass{border:1px solid var(--green);background:rgba(76,175,125,.07);border-radius:8px;padding:12px 16px;margin:14px 0}
.pass h4{color:var(--green);font-family:var(--disp);font-size:17px;letter-spacing:.06em;text-transform:uppercase}
ul.tick{list-style:none;margin-top:6px}
ul.tick li{padding:4px 0 4px 22px;position:relative;font-size:13.5px}
ul.tick li::before{content:"\25A1";position:absolute;left:2px;color:var(--dim)}
h2.sec{font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:.04em;text-transform:uppercase;margin:22px 0 4px}
h2.sec em{font-style:normal;color:var(--ember)}
p.lede{color:var(--dim);font-size:14px;margin-bottom:8px}
.foot{color:var(--faint);font-size:12px;font-family:var(--mono);text-align:center;margin-top:34px;letter-spacing:.06em}
a{color:var(--teal)}
input.lg{width:78px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:var(--gold);
 font-family:var(--mono);font-size:15px;padding:7px 8px;border-radius:6px;text-align:right}
input.lg:focus{outline:none;border-color:var(--gold)}
em.rst{display:block;font-style:normal;font-size:11px;opacity:.55;letter-spacing:.05em;margin-top:3px;text-transform:uppercase}
</style>
</head>
<body>

<header id="hdr">
  <div class="brand">THE <em>FREAK</em> PROTOCOL</div>
  <div class="tagline">92 days · rebuilt, reloaded, unreasonable · Jul 16 — Oct 15, 2026</div>
</header>

<nav id="nav" role="tablist">
  <button class="active" data-tab="today">Today</button>
  <button data-tab="program">Program</button>
  <button data-tab="ankle">Ankle</button>
  <button data-tab="testing">Testing</button>
  <button data-tab="failsafes">Fail-Safes</button>
  <button data-tab="playbook">Playbook</button>
</nav>

<main>
<section class="tab active" id="tab-today"></section>
<section class="tab" id="tab-program"></section>
<section class="tab" id="tab-ankle"></section>
<section class="tab" id="tab-testing"></section>
<section class="tab" id="tab-failsafes"></section>
<section class="tab" id="tab-playbook"></section>
</main>

<script>
/* ============================================================
   THE FREAK PROTOCOL — data + engine
   Progress checkboxes are in-memory only (reset on refresh).
   To persist, wire the checkbox handler to your own storage.
   ============================================================ */

const START = new Date(2026,6,16);           // Jul 16
const END   = new Date(2026,9,15);           // Oct 15
const DAY   = 86400000;
const fmt = d => d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
const dayNum = d => Math.floor((stripT(d)-stripT(START))/DAY)+1;   // 1..92
function stripT(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}

const PHASES=[
 {n:1,name:"THE REBUILD",start:new Date(2026,6,16),end:new Date(2026,7,14),
  goal:"Ankle + shoulder reconstructed, physique built, swim engine installed. Rehab gates govern all lower-body and explosive decisions.",
  color:"var(--ember)"},
 {n:2,name:"ITALY — THE PRT BLOCK",start:new Date(2026,7,15),end:new Date(2026,7,26),
  goal:"No stick, no gym, no pool guaranteed — which is exactly the equipment list for the Navy PRT. Push-ups, plank, running, and a 500-yard swim if you find water. Four of the five things you'll be scored on need a floor and a road. Arrive back aerobically sharper and event-ready.",
  color:"var(--teal)"},
 {n:3,name:"THE RELOAD",start:new Date(2026,7,27),end:new Date(2026,8,9),
  goal:"Back at Brown, full gym: an explicit Push/Pull/Legs built for an athlete — Legs Monday (heavy + contrast plyo), Push Wednesday, Pull + Power Thursday — wrapped in sprint work, field days, and the swim engine. The freak-of-nature block.",
  color:"var(--gold)"},
 {n:4,name:"OFFSEASON + FALL BALL",start:new Date(2026,8,10),end:new Date(2026,9,15),
  goal:"Team lifts and team conditioning now own the biggest share of the week. Your own volume CONTRACTS here — it does not expand. Two lifts + one hard aerobic dose protect everything you built while practice sharpens it, and the swim stays because it's the cardio that survives a season.",
  color:"var(--green)"}
];
function phaseOf(d){d=stripT(d);for(const p of PHASES){if(d>=stripT(p.start)&&d<=stripT(p.end))return p;}return null;}
function weekInPhase(d,p){return Math.floor((stripT(d)-stripT(p.start))/DAY/7)+1;}

/* ---------- shared blocks ---------- */
const SHOULDER_MIN={h:"SHOULDER DAILY MINIMUM (4 min — before everything)",tag:"rehab",rows:[
 ["Band pull-aparts","2\u00d715","Palms down, 1s squeeze"],
 ["Band external rotation, elbow at side","2\u00d715/side","Towel pinned at elbow. Slow."],
 ["Scap push-ups","1\u00d712","Arms locked; only the blades move"]]};
const SHOULDER_FULL={h:"SHOULDER FULL BLOCK (~15 min, done warm)",tag:"rehab",rows:[
 ["Side-lying DB external rotation","3\u00d712\u201315/side","2.5\u20135 lb. THE cuff builder. Strict."],
 ["Band internal rotation","2\u00d715/side","Subscapularis"],
 ["Prone Y-T-W","2\u00d78 each","Thumbs up, 1s hold. DBs from Wk 4"],
 ["Face pulls","3\u00d715","Pull to eyebrows, knuckles rotate up"],
 ["Serratus wall slides","2\u00d710","Reach at the top"],
 ["Isometric biceps hold @90\u00b0","3\u00d730s","Light DB. \u22642/10. Tendon dose."],
 ["Cross-body + sleeper stretch","2\u00d730s each","Gentle"]]};
const CUFF_FIN={h:"CUFF FINISHER (3 min)",tag:"rehab",rows:[
 ["Face pulls","3\u00d715",""],["Band external rotation","2\u00d715/side",""]]};
/* OS TRIGONUM PROTOCOL — replaces the old lateral-sprain block.
   Enemy position is END-RANGE PLANTARFLEXION, not inversion.
   Stage 1 = now\u2192Italy | Stage 2 = Italy | Stage 3 = Reload | Stage 4 = in-season */
/* ---------- ANKLE: date-aware. Aug 10 \u2192 Sep 8. FINAL VERSION ----------
   Corrected model. The mechanism is DIRECT COMPRESSION ON LANDING \u2014 not accumulated torsion.
   Evidence: original injury was landing flat. Saturday, game 1 (full cutting, dodging,
   contact) was completely fine; the flare came from landing wrong in game 2.
   A full game of rotation is already tolerated. What is not yet tolerated is a re-impact
   on tissue that is still sensitized. So the target is LANDING CONTROL, not rotation. */
const ankleStage=(d)=>{
 const t=stripT(d).getTime();
 if(t<stripT(new Date(2026,7,15)).getTime()) return 1;
 if(t<stripT(new Date(2026,7,29)).getTime()) return 2;
 return 3;
};
/* IMPACT LADDER \u2014 one rung per session. Advance only on a morning with no swelling. */
const LAND_LADDER=[
 ["Rung 1","Double-leg pogos + small hops, flat ground","3\u00d720. Quiet landings. If you can hear it, you are landing too hard."],
 ["Rung 2","Drop landings from a low box, double leg","3\u00d75. Step off, absorb, stick it. Not jumping \u2014 landing."],
 ["Rung 3","Single-leg hops in place, stick every landing","3\u00d78/side. Hold each landing 2s before the next rep."],
 ["Rung 4","Single-leg bounding + lateral hop-and-stick","3\u00d76/side. Now you are landing off-balance on purpose."],
 ["Rung 5","Jump + contested landing \u00b7 live play","Someone bumps you mid-air. This is the one that mimics game 2."]];

function ANKLE_BLOCK(d){
 const st=ankleStage(d);
 const core=[
  ["Band eversion + inversion, heaviest band","3\u00d715 each","3s out, 3s back"],
  ["Single-leg balance, eyes closed, on a pillow","3\u00d745s","Progress the task \u2014 head turns, then ball toss. Never the clock."],
  ["Single-leg heel raise off a step, loaded","3\u00d715","Full range. Slow 3s down \u2014 the eccentric is what builds shock absorption."]];
 if(st===1) return {h:"ANKLE \u2014 5 MIN (settle it down)",tag:"rehab",rows:core.concat([
  ["\u26d4 No jumping, no landing, no games","\u2014","It is puffy. Let it go quiet before you load impact into it. Ice + elevate in the evening."]])};
 if(st===2) return {h:"ANKLE \u2014 ITALY",tag:"rehab",rows:[
  ["Supportive lace-up shoes. Not sandals, not flats.","all trip","Your injury mechanism is landing wrong. Bad footing on cobblestone is the same event in slow motion."],
  ["Walk all you want on even ground","\u2014","Volume was never the problem"],
  ["Watch your footing on Pompeii stone, cobblestone, stairs, sand","\u2014","Not the twisting \u2014 the misstep. One bad step off a curb is what you are avoiding."],
  ["Band + balance if convenient","5 min","Fine to skip days. Two weeks with no impact is exactly what this needs."]]};
 return {h:"ANKLE \u2014 5 MIN + IMPACT LADDER",tag:"rehab",rows:core.concat([
  ["\u2b06 RUN THE NEXT RUNG of the impact ladder","1 rung/session","See the ANKLE tab. Advance ONLY after a morning with no swelling. Swelling = repeat the rung."]])};
}
const ANKLE=(w)=>ANKLE_BLOCK(viewDate);
const CORE_LOADED={h:"CORE — LOADED (Mon / Wed / Fri only)",tag:"lift",rows:[
 ["Cable crunch","4\u00d712\u201315","Rope behind head, round the spine, hips fixed. Load it like a lift.","60 s"],
 ["Side cable crunch — HIP-HEIGHT handle","3\u00d712\u201315/side","Low anchor ONLY. A high pulley puts the working shoulder in loaded abduction for no reason.","45 s"],
 ["Pallof press","3\u00d712/side","Anti-rotation stiffness = shot speed","45 s"],
 ["Forearm plank — PRT EVENT · max hold","2\u00d7 max","Straight line head to heels. Clock stops the instant form breaks. Time it every Friday.","90 s"]]};
const PALLOF={h:"PALLOF PRIMER (2 min — every training day)",tag:"lift",rows:[
 ["Pallof press","2\u00d712/side","Costs nothing, transfers to everything. That is why it is daily."]]};
const PRT_TOUCH={h:"PRT TOUCH (5 min — twice weekly)",tag:"test",rows:[
 ["Push-ups — 2 min max reps","1\u00d7 timed","THE event. Rest only in the up position, chest to a fist off the deck.","full"],
 ["Forearm plank — max hold","1\u00d7 timed","Log both. Two tests a year — you never want to be guessing.","full"]]};
const PRACTICE={h:"AM — TEAM PRACTICE (this is the day's main event)",tag:"lax",rows:[
 ["Team / captain's practice","60\u201390 min","From Sep 7 this is the primary training stimulus, not an addition to one. Everything below is scheduled AROUND it.","—"],
 ["BEFORE: shoulder minimum + ankle insurance","5 min","At 6am, in the dark, every time. This is what keeps you on the field in October.","—"],
 ["AFTER: protein within the hour + 10 min mobility","15 min","","—"]]};
const PRACTICE_START=new Date(2026,8,7);
function practiceOn(d){const t=stripT(d);return t>=stripT(PRACTICE_START)&&d.getDay()>=1&&d.getDay()<=5;}
const WALLBALL=(min,note)=>({h:"LACROSSE — EVERY DAY",tag:"lax",rows:[
 ["Wall ball",min+" min",note||"Both hands, quick sticks, fakes. The stick never takes a day off."]]});

/* ---------- PHASE 1 sessions (weekday 0=Sun..6=Sat) ---------- */
function p1(dow,w){
 const wkA=(a)=>a[Math.min(w,4)-1];
 switch(dow){
  case 4: return {title:"SWIM — VO2 INTERVALS · ALL FREESTYLE",tags:["swim","rehab"],blocks:[
    SHOULDER_MIN,
    {h:"STROKE ORDER — read before you get in",tag:"swim",rows:[
     ["EVERY hard rep is freestyle","no exceptions","This is the intensity day. Freestyle moves the most water per unit of effort — right tool for VO2. No breaststroke, no sidestroke, no mixing."],
     ["If you can't hold freestyle for a whole rep","the set is too hard","Lengthen the send-off. Do NOT switch stroke mid-rep — that converts an interval into a rest."]]},
    {h:"WARM-UP",tag:"swim",rows:[
     ["Easy freestyle","300m",""],
     ["Build 50s","4\u00d750m","The last one should feel like rep 1 of the main set"]]},
    {h:"MAIN SET — SEND-OFF INTERVALS",tag:"swim",rows:[
     ["FIRST: set your send-off","time rep 1","Swim one hard 100. Take that time, add :20, round UP to the next :05. That is your send-off for the whole set. Recalculate every 3 weeks, not every session."],
     ["The set",wkA(["10\u00d7100 free · on your send-off","10\u00d7100 free · send-off \u2212:05","12\u00d7100 free · send-off \u2212:05","8\u00d7100 free · send-off \u2212:10, then 4\u00d750 max"]),"You leave on the clock, not when you feel ready. Swim faster, earn more rest. Fade, and rest shrinks until the set ends itself."],
     ["Stop condition","miss the send-off twice","That is the set telling you it's finished. Stopping there is the design working, not a failure."]]},
    {h:"COOL-DOWN",tag:"swim",rows:[["Easy free or backstroke","200m","Backstroke opens the front of the shoulder after a hard free set"]]},
    PALLOF,SHOULDER_FULL,ANKLE(w),WALLBALL(15)],
    why:"VO2 leads the week while you're freshest. The send-off replaces fixed rest so the set autoregulates to whatever fitness you actually have that day — the same logic as the German protocol. Shoulder block lands post-swim: warm tissue takes cuff work best, and fatigue can't wreck stroke mechanics mid-set."};
  case 5: return {title:"PULL + HIPS + ARMS",tags:["lift","rehab"],blocks:[
    SHOULDER_MIN,
    {h:"A — PULL",tag:"lift",rows:[
     ["Pull-ups — overhand/neutral ONLY","5\u00d7max\u22122","1\u20132 RIR always. Vest Wk 3\u20134 only if shoulder silent 2 wks.","2\u20133 min"],
     ["1-arm DB row, neutral grip","4\u00d78\u201310/side","Heavy. Elbow to hip.","90 s"],
     ["Rear-delt flyes, chest supported","3\u00d715","Light + strict \u2014 the from-behind look","45 s"]]},
    {h:"B — HIPS + HAMSTRINGS",tag:"lift",rows:[
     ["Hip thrust","4\u00d78\u201312","Heavy. Engine + centerpiece.","2\u20133 min"],
     ["Nordic / sliding leg curls","3\u00d76\u20138","Cuts hamstring injury risk ~50% (van der Horst 2015)","2 min"],
     [w>=3?"DB RDL (gates passed)":"— standing loaded hinge locked until Wk 3 gates —",w>=3?"3\u00d710":"","Perfect form, moderate weight.","2 min"],
     ["Copenhagen plank","3\u00d720\u201330s/side","Groin injuries \u221241% (Har\u00f8y 2019)","45 s"],
     ["Side-lying abduction / banded clam","3\u00d715/side","Glute med = clean landings","30 s"]]},
    {h:"C — ARMS (elbow flexors: NEUTRAL + PRONATED ONLY)",tag:"lift",rows:[
     ["Hammer curls","4\u00d710\u201312","Brachialis. Doesn't cross the shoulder, doesn't touch the bicipital groove. 3s eccentric Wk 4.","60\u201390 s"],
     ["Reverse curls","3\u00d712\u201315","Brachioradialis + brachialis. Pronated, so zero supination load on the injured tendon.","60 s"],
     ["NO supinated curls — barbell, EZ, preacher, incline","—","Supination is the movement that maximally loads the long head. This is the one exclusion that isn't negotiable until the Sep 2 gate.","—"],
     ["DB skull crushers","3\u00d710\u201315","Triceps are 2/3 of the arm","90 s"],
     [w>=3?"Overhead DB triceps extension (unlocked)":"Overhead extension unlocks Wk 3 if pressing stays silent",w>=3?"3\u00d712":"","Long head","60 s"],
     ["Cable lateral raise","3\u00d715\u201320","Fourth side-delt touch of the week","45 s"]]},
    CORE_LOADED,PRT_TOUCH,CUFF_FIN,ANKLE(w),WALLBALL(15)],
    why:"Elbow flexor volume went from 3 sets to 7, all of it neutral or pronated \u2014 that's brachialis and brachioradialis, which insert on the ulna and radius and never enter the bicipital groove. You get real arm growth (brachialis pushes the biceps UP, which is the thickness you actually want) without loading the tendon that's still symptomatic in dips. Supinated curls come back gated on the Sep 2 result, not on a date."};
  case 6: return {title:"SWIM — PEAK SESSION",tags:["swim"],blocks:[

function getSession(d){
 const p=phaseOf(d); if(!p) return null;
 let w=weekInPhase(d,p); const dow=d.getDay();
 let s;
 if(p.n===1){w=Math.min(w,4); s={...p1(dow,w),phase:p,week:w};}
 else if(p.n===2) s={...p2(d),phase:p,week:w};
 else if(p.n===3) s={...p3(dow,w,d),phase:p,week:w};
 else s={...p4(dow,w),phase:p,week:w};
 if(practiceOn(d)){
  s={...s,
     title:"AM PRACTICE \u2192 "+s.title,
     tags:[...new Set(['lax'].concat(s.tags||[]))],
     blocks:[PRACTICE].concat(s.blocks||[]),
     why:"PRACTICE CAME FIRST TODAY. Everything below runs in the afternoon or evening, on legs that have already worked. If practice was brutal, the lift loses its LAST movement \u2014 not its first. "+(s.why||"")};
 }
 return s;
}

const LSKEY='freakProtocol.v2';
let STORE={done:{},log:{}};
function loadStore(){
 try{
  const raw=localStorage.getItem(LSKEY);
  if(raw){
   const o=JSON.parse(raw)||{};
   STORE.done=(o.done&&typeof o.done==='object')?o.done:{};   // migration: backfill missing keys
   STORE.log =(o.log &&typeof o.log ==='object')?o.log :{};
  }
 }catch(e){console.warn('store load failed, starting clean',e);STORE={done:{},log:{}};}
}
function saveStore(){try{localStorage.setItem(LSKEY,JSON.stringify(STORE));}catch(e){console.warn('store save failed',e);}}
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function toggleDone(k,el){
 try{
  if(el.checked)STORE.done[k]=1; else delete STORE.done[k];
  const row=el.closest('.exrow'); if(row)row.classList.toggle('done',el.checked);
  saveStore();
 }catch(e){console.warn('toggle failed',e);}
}
function logVal(field,el){
 try{
  const k=dkey(viewDate);
  if(!STORE.log[k])STORE.log[k]={};
  const v=el.value.trim();
  if(v==='')delete STORE.log[k][field]; else STORE.log[k][field]=v;
  saveStore();
 }catch(e){console.warn('log failed',e);}
}
function resetAll(){
 if(!confirm('Erase ALL checkmarks and logged numbers? This cannot be undone.'))return;
 STORE={done:{},log:{}};saveStore();renderToday();
}

function renderFailsafes(){
 $('tab-failsafes').innerHTML=`
 <h2 class="sec">FAIL-<em>SAFES</em></h2>
 <p class="lede">Every weekly target has a pre-decided correction. Missing a number never means "try harder" — it means run the specific fix. Decided now, so no negotiating with yourself later.</p>
 <table>
 <tr><th>If this happens\u2026</th><th>\u2026the fix is</th></tr>
 <tr><td><b>Missed a session</b></td><td>Never miss two. Swap, don't skip: the week's hardest session survives, the accessory session dies. A missed lift folds its 2 main lifts into the next session as 2 sets each.</td></tr>
 <tr><td><b>Swim/run interval times slipping across the week</b></td><td>It's almost never fitness. Audit in order: sleep hours \u2192 carbs on hard days \u2192 pacing rep 1 (you're starting too hot). Fix the first broken one. Still slipping after a week: add one easy Z2 session, subtract nothing.</td></tr>
 <tr><td><b>Pull-ups stalled 2 weeks</b></td><td>Check RIR honesty first (film a set — bar speed doesn't lie). Then: add one back-off set of 50% reps, +20g protein/day, and verify sleep. Progress resumes within 10 days or drop 2 total sets for a week (overreached, not underworked).</td></tr>
 <tr><td><b>Morning resting HR +7bpm for 3 days</b></td><td>Under-recovered. That day's session drops one hard set per block; next Sunday becomes fully off. HR normal = resume. This one is not optional — it's the earliest overtraining alarm you own.</td></tr>
 <tr><td><b>Sleep average under 8h for a week</b></td><td>Cut the LAST hard set of every session until fixed (tired training is stolen training). Fix: fixed wake time 7 days, screens off 60 min before bed, room cold + black. Sleep is a training variable, not a lifestyle preference — under 8h \u2248 1.7\u00d7 injury risk (Milewski 2014).</td></tr>
 <tr><td><b>Weight dropping >1%/week during deficit weeks</b></td><td>You're burning muscle, not just fat. +150 kcal (carbs, on hard days) and reassess in 7 days.</td></tr>
 <tr><td><b>Weight flat + waist flat for 2 weeks (Wk 3+)</b></td><td>\u2212150 kcal from rest-day carbs only. Hard-day fueling is untouchable.</td></tr>
 <tr><td><b>Shoulder: pain during pulling</b></td><td>End pulling that day. Next session: 50% pull volume. Clears = rebuild over a week. Doesn't clear, or ANY night pain 3+ nights = message PT, hold all pulling progression.</td></tr>
 <tr><td><b>Ankle: swelling, giving-way, or pain >3/10</b></td><td>Rehab protocol rules override everything. Back one level, morning-after rule decides. New bruising or a rolling episode = PT same day.</td></tr>
 <tr><td><b>No pool access (camp, travel, closure)</b></td><td>Hard field or sport work that day SUBSTITUTES \u2014 it does not stack. Do not make up missed swims later in the week and never run two swim sessions back to back to catch up. Resume on the next scheduled swim as if nothing happened. Two missed swims in a 92-day block is noise; a doubled-up week is how shoulders get re-irritated.</td></tr>
 <tr><td><b>Worked a camp / clinic (hours of shooting)</b></td><td>Count it as a hard shoulder day, because it is one. The next scheduled pressing session holds load instead of progressing, and the morning-after check decides whether it happens at all. Camp days are training, not bonus activity.</td></tr>
 <tr><td><b>Dips: "it felt okay today"</b></td><td>Irrelevant. ONE scheduled re-test, Sep 2 — first full-gym push day back at Brown. Pain-free during AND the next morning or they stay out through the fall. This row exists specifically to stop you re-deciding it every Monday.</td></tr>
 <tr><td><b>Engine-room count drops 3+ lengths at same effort</b></td><td>Audit in order: sleep \u2192 carbs the day before \u2192 did you go out too hot. Fix the first broken one. But FIRST check whether you just stepped up the stroke ratio \u2014 if so the dip is expected, hold the ratio and let it recover across two sessions. Do NOT extend the clock past 44 min to hit the number; that defeats the entire design of the session.</td></tr>
 <tr><td><b>Tempted to jump straight to continuous freestyle</b></td><td>Don't. The ladder exists because your baseline was 1:1 free/breast \u2014 the breast lengths were active recovery, not filler. Skipping steps buys a gasping session with a collapsing stroke: worse mechanics at higher cost. Step the ratio, hold the clock.</td></tr>
 <tr><td><b>Missing the swim send-off in the first 4 reps</b></td><td>Send-off is set too tight. Add :05 and finish the set. Recalculate properly next session off a fresh timed 100. A set you blow up in rep 3 trains nothing.</td></tr>
 <tr><td><b>Adding a new goal (Navy, PRT, anything)</b></td><td>Something comes OUT. Total weekly hard sessions is capped, not elastic. New priority in = lowest-value session out. This is the row that stops the program silently doubling in size.</td></tr>
 <tr><td><b>Italy: no pull-up bar found</b></td><td>Towel rows on a railing/door + doorframe iso rows + wide push-up volume \u00d71.5. Back width holds for 12 days easily. Search: parks (calisthenics bars are everywhere in Italian parks), playgrounds, scaffolding.</td></tr>
 <tr><td><b>Italy: schedule chaos, session windows vanish</b></td><td>The irreducible day: 20 min run with 6\u00d71 min hard + push-up ladder + 2\u00d7 max plank. 25 minutes total, needs a road and a floor. Zero-day count for the trip must stay \u22643.</td></tr>
 <tr><td><b>Italy: no stick (confirmed \u2014 it isn't coming)</b></td><td>Nothing replaces wall ball for 12 days and nothing needs to. Hands come back within three days of returning. Do NOT invent a substitute drill to feel productive \u2014 use the freed time on the PRT events instead. First wall session is Aug 27.</td></tr>
 <tr><td><b>Back at Brown: DOMS wrecking week 1 of Reload</b></td><td>Planned. Loads start at 80% of pre-trip; if soreness compromises sprint quality, sprint day slides 24h. Speed work only happens fresh.</td></tr>
 <tr><td><b>Season: practice + lifts burying you</b></td><td>Drop the VO2 top-up first, Lift B second, Lift A never. One heavy full-body session/week maintains strength for months in-season.</td></tr>
 <tr><td><b>From Sep 7: practice was brutal, lift is scheduled</b></td><td>The lift loses its LAST movement, never its first. Main compound always happens; accessories are the shock absorber. Never cancel the whole session \u2014 a 20-minute lift beats a skipped one for maintaining strength.</td></tr>
 <tr><td><b>Wanting to keep August set counts into September</b></td><td>You can't, and the reason is arithmetic. Five morning practices adds 6\u20137 hours of weekly load. Recoverable volume is a function of EVERYTHING you do, not everything you lift \u2014 a deficit and heavy field work both lower your ceiling (Israetel's own landmarks say so). Volume contracts in September. That is the plan working, not the plan failing.</td></tr>
 <tr><td><b>Motivation gone</b></td><td>Motivation was never the plan. The plan is the plan. Do the first 10 minutes; the day always follows. Read today's quote again. Then start.</td></tr>
 </table>
 <div class="alert"><h4>Hard stops — no fail-safe applies, PT/doctor same day</h4>
 <ul class="tick"><li>Ankle: new bruising, giving-way episode, swelling persisting past 24h</li>
 <li>Shoulder: night pain 3+ consecutive nights, or pulling pain that survives a 50% volume cut</li>
 <li>Anything sharp, sudden, or with a pop — anywhere</li></ul></div>`;
}

function renderPlaybook(){
 $('tab-playbook').innerHTML=`
 <h2 class="sec">THE <em>PLAYBOOK</em></h2>

 <div class="card"><div class="chead"><h3>Sleep — the anabolic window</h3></div><div class="cbody"><table>
 <tr><td><b>Phases 1\u20133</b></td><td class="mono">8.5\u20139.5 h in bed</td></tr>
 <tr><td><b>Phase 4 (in-season)</b></td><td class="mono">9+ h · naps \u226430 min pre-3pm</td></tr>
 <tr><td><b>Non-negotiables</b></td><td>Fixed wake time (even weekends) · screens off 60 min before bed · cold dark room · caffeine cutoff 10 hours before bed</td></tr>
 <tr><td><b>Why this hard-lined</b></td><td>Milewski 2014: adolescent athletes under 8h \u2192 ~1.7\u00d7 injury rate. Mah 2011 (Stanford): sleep extension alone improved sprint times and shooting accuracy. Sleep is the only legal performance drug this good.</td></tr></table></div></div>

 <div class="card"><div class="chead"><h3>Fuel</h3></div><div class="cbody"><table>

 <div class="card"><div class="chead"><h3>Rest between sets</h3><span class="sub">the default rules</span></div><div class="cbody"><table>
 <tr><th>Type of set</th><th>Rest</th><th>Why</th></tr>
 <tr><td><b>Heavy compounds</b> (trap-bar, hip thrust, leg press, pull-ups, incline press)</td><td class="mono">2\u20133 min</td><td>Under 2 min and the next set is limited by breathing and lactate rather than by the muscle \u2014 you lose reps without gaining stimulus</td></tr>
 <tr><td><b>Secondary compounds</b> (rows, pulldowns, second-angle presses, RDL)</td><td class="mono">90 s \u2013 2 min</td><td>Enough to hold load, short enough to keep the session sane</td></tr>
 <tr><td><b>Isolation</b> (curls, pushdowns, extensions, crossovers)</td><td class="mono">60\u201390 s</td><td>Small muscles clear fatigue fast</td></tr>
 <tr><td><b>Side delts / rear delts / face pulls</b></td><td class="mono">45\u201360 s</td><td>High-volume-tolerant, low systemic cost</td></tr>

 <tr><td>Copenhagen adduction work cuts groin injuries ~41%</td><td class="mono">Har\u00f8y et al. 2019, BJSM</td></tr>
 <tr><td>Balance/proprioception training slashes ankle re-sprain risk</td><td class="mono">Verhagen 2004; McKeon & Hertel 2008</td></tr>

 <tr><td>Weekly volume drives hypertrophy more than session size \u2014 justifies splitting pressing across two days</td><td class="mono">Schoenfeld et al. 2017 meta</td></tr>

 <p class="lede" style="margin-top:8px">Author/year given so you can verify each one yourself — a program you can audit is a program you can trust.</p></div></div>

 <div class="card"><div class="chead"><h3>Permanent rules — the constitution</h3></div><div class="cbody">
 <ul class="tick">
 <li>Pull-ups at 1\u20132 RIR, overhand/neutral grip: forever. This rule is why the shoulder works.</li>
 <li>Ankle insurance (eversion + balance + calves) 2\u00d7/week: forever. Sprained ligaments that stop training proprioception re-sprain.</li>
